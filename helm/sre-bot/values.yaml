collector:
  image: sre-bot-collector
  tag: latest
  replicas: 1
  scrapeTarget: http://prometheus:9090/metrics
  listenPort: 8080
  appName: sre-bot-collector

aggregator:
  image: sre-bot-aggregator
  tag: latest
  replicas: 1
  appName: sre-bot-aggregator

detector:
  image: sre-bot-detector
  tag: latest
  replicas: 1
  appName: sre-bot-detector

agent:
  image: sre-bot-agent
  tag: latest
  replicas: 1
  ollamaHost: http://ollama.sre-bot-infra.svc.cluster.local:11434
  ollamaModel: llama3.2:3b
  appName: sre-bot-agent

kafka:
  name: kafka
  image: confluentinc/cp-kafka
  tag: "7.4.0"
  broker: kafka.sre-bot-infra.svc.cluster.local:9092
  topic: metrics
  container_port: 9092
  client_port: 9092

clickhouse:
  name: clickhouse
  host: clickhouse.sre-bot-infra.svc.cluster.local
  container_port: 8123
  service_port: 9000
  image: clickhouse/clickhouse-server
  tag: "23.8"


ns:
  infra_namespace: sre-bot-infra
  app_namespace: sre-bot-apps
  app: sre-bot

zookeeper:
  name: zookeeper
  image: confluentinc/cp-zookeeper
  tag: "7.4.0"
  client_port: 2181
  container_port: 2181

ollama:
  name: ollama
  image: ollama/ollama
  tag: latest
  container_port: 11434
  ollama_model: llama3.2:3b
  