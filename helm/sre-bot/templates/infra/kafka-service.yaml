apiVersion: v1
kind: Service
metadata:
    name: {{ .Values.kafka.name }}
    namespace: {{ .Values.ns.infra_namespace }}
spec:
    clusterIP: None
    selector:
        app: {{ .Values.kafka.name }}
    ports:
        - port: {{ .Values.kafka.client_port }}
          targetPort: {{ .Values.kafka.container_port }}