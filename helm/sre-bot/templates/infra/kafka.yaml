apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: {{ .Values.kafka.name }}
    namespace: {{ .Values.ns.infra_namespace }}
spec:
    serviceName: {{ .Values.kafka.name }}
    replicas: 1
    selector:
        matchLabels:
            app: {{ .Values.kafka.name }}
    template:
        metadata:
            labels:
                app: {{ .Values.kafka.name }}
        spec:
            containers:
                - name: {{ .Values.kafka.name }}
                  image: {{ .Values.kafka.image }}:{{ .Values.kafka.tag }}
                  env:
                    - name: KAFKA_ZOOKEEPER_CONNECT
                      value: "zookeeper:2181"
                    - name: KAFKA_BROKER_ID
                      value: "1"
                    - name: KAFKA_ADVERTISED_LISTENERS
                      value: "PLAINTEXT://{{ .Values.kafka.name }}.{{ .Values.ns.infra_namespace }}.svc.cluster.local:9092"
                    - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
                      value: "1"
                  ports:
                    - containerPort: {{ .Values.kafka.container_port }}
                  volumeMounts:
                    - name: kafka-data
                      mountPath: /var/lib/kafka/data
    volumeClaimTemplates:
      - metadata:
          name: kafka-data
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
