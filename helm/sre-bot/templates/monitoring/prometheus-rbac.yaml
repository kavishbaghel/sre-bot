apiVersion: v1
kind: ServiceAccount
metadata:
    name: {{ .Values.prometheus.name }}-sa
    namespace: {{ .Values.ns.monitoring_namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: {{ .Values.prometheus.name }}-clusterrole
rules:
    - apiGroups: [""]
      resources: ["nodes", "pods", "services", "endpoints"]
      verbs: ["get", "list", "watch"]
    - apiGroups: [""]
      resources: ["configmaps"]
      verbs: ["get"]
    - nonResourceURLs: ["/metrics"]
      verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    name: {{ .Values.prometheus.name }}-clusterrolebinding
roleRef:
    kind: ClusterRole
    name: {{ .Values.prometheus.name }}-clusterrole
    apiGroup: rbac.authorization.k8s.io
subjects:
    - kind: ServiceAccount
      name: {{ .Values.prometheus.name }}-sa
      namespace: {{ .Values.ns.monitoring_namespace }}
