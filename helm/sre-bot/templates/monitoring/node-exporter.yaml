apiVersion: apps/v1
kind: DaemonSet
metadata:
    name: node-exporter
    namespace: {{ .Values.ns.monitoring_namespace }}
spec:
    selector:
        matchLabels: 
            app: node-exporter
    template:
        metadata:
            labels:
                app: node-exporter
        spec:
            containers:
              - name: node-exporter
                image: prom/node-exporter:v1.7.0
                ports:
                  - containerPort: 9100
                resources:
                    requests:
                        memory: "64Mi"
                        cpu: "100m"
                    limits:
                        memory: "128Mi"
                        cpu: "250m"